---
id: es.danirod.Cartero
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cartero

finish-args:
  - --device=dri
  # I suspect many users will have their code outside xdg-documents
  - --filesystem=home
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  - name: blueprint-compiler
    buildsystem: meson
    cleanup:
      - "*"
    sources:
      - type: git
        url: https://gitlab.gnome.org/GNOME/blueprint-compiler
        tag: v0.18.0
  - name: cartero
    buildsystem: meson
    run-tests: true
    config-opts:
      - -Dprofile=default
    sources:
      - type: archive
        url: https://github.com/danirod/cartero/releases/download/v25.0/cartero-25.0.tar.xz
        sha256: e5b60c652d6555f99862b15fb53c195588fa642362a90aa5b847cd427b45e452
