---
id: es.danirod.Cartero
runtime: org.gnome.Platform
runtime-version: '49'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cartero

finish-args:
  - --device=dri
  # I suspect many users will have their code outside xdg-documents
  - --filesystem=home
  - --share=ipc
  - --share=network
  - --socket=fallback-x11
  - --socket=wayland

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

modules:
  - name: cartero
    buildsystem: meson
    run-tests: true
    config-opts:
      - -Dprofile=default
    sources:
      - type: archive
        url: https://github.com/danirod/cartero/releases/download/v26.0/cartero-26.0.tar.xz
        sha256: b8a6a610622b606e91f8971ad54b85f0bc971a69329b48ece297207b19bf3812
